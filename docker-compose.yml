services:
  backend:
    build:
      context: ./back_end
      dockerfile: Dockerfile

    container_name: anatome-backend

    environment:
      DATABASE_URL: sqlite:////app/data/anatome.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_REPORT_MODEL: ${OPENAI_REPORT_MODEL:-openai/gpt-5-mini}

    volumes:
      - anatome_database:/app/data

    expose:
      - "8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile

    container_name: anatome-frontend

    depends_on:
      - backend

    ports:
      - "80:80"

    restart: unless-stopped

volumes:
  anatome_database: